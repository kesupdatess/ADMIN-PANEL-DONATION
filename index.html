<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KES Updates - Super Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.topbar h1{font-size:20px;font-weight:800;background:linear-gradient(135deg,#059669,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.topbar .actions{display:flex;gap:10px}
.btn-sm{padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:.2s}
.btn-refresh{background:#eff6ff;color:#2563eb}
.btn-export{background:#ecfdf5;color:#059669}
.container{padding:24px;max-width:1400px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.stat{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.03);border:1px solid #e2e8f0}
.stat .label{font-size:12px;color:#64748b;font-weight:600;text-transform:uppercase}
.stat .val{font-size:26px;font-weight:800;color:#0f172a;margin-top:8px}
.charts-row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px}
.chart-box{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.03);border:1px solid #e2e8f0;height:300px}
.chart-box h3{font-size:14px;font-weight:700;margin-bottom:16px}
.controls{background:#fff;border-radius:16px;padding:16px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.03);border:1px solid #e2e8f0;display:flex;gap:12px;flex-wrap:wrap}
.controls input,.controls select{padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:13px;font-family:inherit}
.table-wrap{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.03);border:1px solid #e2e8f0}
.table-head{padding:20px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1000px}
thead{background:#f8fafc}
th{padding:14px 16px;text-align:left;font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;border-bottom:1px solid #e2e8f0}
td{padding:14px 16px;font-size:13px;border-bottom:1px solid #f1f5f9}
tr:hover{background:#f8fafc}
.status{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.status.pending{background:#fef3c7;color:#92400e}
.status.verified{background:#d1fae5;color:#065f46}
.status.rejected{background:#fee2e2;color:#991b1b}
.status.qr{background:#dbeafe;color:#1e40af}
.actions{display:flex;gap:6px}
.actions button{padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.actions button:hover{transform:translateY(-1px)}
.actions .view{color:#2563eb;border-color:#bfdbfe}
.actions .accept{color:#059669;border-color:#a7f3d0;background:#ecfdf5}
.actions .reject{color:#dc2626;border-color:#fecaca;background:#fef2f2}
.actions .cert{color:#7c3aed;border-color:#ddd6fe}
.actions .rcpt{color:#ea580c;border-color:#fed7aa}
.actions .del{color:#64748b;border-color:#e2e8f0}
.empty{text-align:center;padding:60px 20px;color:#64748b}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal.active{display:flex}
.modal-box{background:#fff;border-radius:20px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto}
.modal-head{padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:24px}
.modal-body img{width:100%;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:16px}
@media(max-width:768px){.charts-row{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="topbar">
<h1>KES Updates - Super Admin</h1>
<div class="actions">
<button class="btn-sm btn-refresh" onclick="loadData()">🔄 Refresh</button>
<button class="btn-sm btn-export" onclick="exportCSV()">📥 Export CSV</button>
</div>
</div>
<div class="container">
<div class="stats">
<div class="stat"><div class="label">Total Donations</div><div class="val" id="s-total">0</div></div>
<div class="stat"><div class="label">Total Revenue</div><div class="val" id="s-amount">Rs 0</div></div>
<div class="stat"><div class="label">Trees Planted</div><div class="val" id="s-trees">0</div></div>
<div class="stat"><div class="label">Pending Action</div><div class="val" id="s-pending">0</div></div>
</div>
<div class="charts-row">
<div class="chart-box"><h3>Donations Trend</h3><canvas id="trendChart"></canvas></div>
<div class="chart-box"><h3>Status Breakdown</h3><canvas id="statusChart"></canvas></div>
</div>
<div class="controls">
<input type="text" id="f-search" style="flex:1" placeholder="Search name, email or ID..." oninput="filterData()">
<select id="f-status" onchange="filterData()">
<option value="">All Status</option>
<option value="pending">Pending</option>
<option value="verified">Verified</option>
<option value="rejected">Rejected</option>
<option value="qr_generated">QR Generated</option>
</select>
</div>
<div class="table-wrap">
<div class="table-head"><h3>Transactions</h3><div id="t-count" style="font-size:12px;color:#64748b">0 records</div></div>
<div class="table-scroll">
<table>
<thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Amount</th><th>Trees</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
<tbody id="t-body"></tbody>
</table>
</div>
<div class="empty" id="empty" style="display:none">No data found</div>
</div>
</div>
<div class="modal" id="modal">
<div class="modal-box">
<div class="modal-head"><h3>Details</h3><button class="btn-sm" onclick="closeModal()" style="background:#f1f5f9">Close</button></div>
<div class="modal-body" id="modalBody"></div>
</div>
</div>
<script>
const U='https://uegdizdnminwhkxcdcle.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlZ2RpemRubWlud2hreGNkY2xlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwODk2MjgsImV4cCI6MjA5NzY2NTYyOH0.2wiAHbaoNoDva_tRseDAywVMu_6AioCGlVLgoVb0d6s';
const sb=window.supabase.createClient(U,K);
let allData=[], filteredData=[], tChart, sChart;

async function loadData(){
const{data}=await sb.from('donations').select('*').order('created_at',{ascending:false});
allData=data||[];
filteredData=allData;
renderStats();
renderCharts();
renderTable();
}

function renderStats(){
document.getElementById('s-total').textContent=filteredData.length;
document.getElementById('s-amount').textContent='Rs '+filteredData.reduce((s,d)=>s+(d.amount||0),0).toLocaleString('en-IN');
document.getElementById('s-trees').textContent=filteredData.reduce((s,d)=>s+Math.max(1,Math.floor((d.amount||0)/10)),0);
document.getElementById('s-pending').textContent=filteredData.filter(d=>d.status==='pending').length;
}

function renderCharts(){
if(tChart)tChart.destroy();
if(sChart)sChart.destroy();
const days={};for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days[d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})]=0;}
filteredData.forEach(d=>{const date=new Date(d.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'});if(days[date]!==undefined)days[date]++;});
tChart=new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:Object.keys(days),datasets:[{label:'Donations',data:Object.values(days),borderColor:'#2563eb',fill:true,backgroundColor:'rgba(37,99,235,0.1)',tension:0.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
const statuses={pending:0,verified:0,rejected:0,qr_generated:0};
filteredData.forEach(d=>{if(statuses[d.status]!==undefined)statuses[d.status]++});
sChart=new Chart(document.getElementById('statusChart'),{type:'doughnut',data:{labels:['Pending','Verified','Rejected','QR Gen'],datasets:[{data:Object.values(statuses),backgroundColor:['#fbbf24','#10b981','#ef4444','#3b82f6']}]},options:{responsive:true,maintainAspectRatio:false}});
}

function filterData(){
const s=document.getElementById('f-search').value.toLowerCase();
const st=document.getElementById('f-status').value;
filteredData=allData.filter(d=>((d.name||'').toLowerCase().includes(s)||(d.email||'').toLowerCase().includes(s)||(d.id+'').includes(s))&&(st?d.status===st:true));
renderStats();
renderTable();
}

function renderTable(){
const body=document.getElementById('t-body');
document.getElementById('t-count').textContent=filteredData.length+' records';
if(filteredData.length===0){body.innerHTML='';document.getElementById('empty').style.display='block';return}
document.getElementById('empty').style.display='none';
body.innerHTML=filteredData.map(d=>{
const t=Math.max(1,Math.floor((d.amount||0)/10));
const sc=d.status==='pending'?'pending':d.status==='verified'?'verified':d.status==='rejected'?'rejected':'qr';
const st=d.status==='pending'?'Pending':d.status==='verified'?'Verified':d.status==='rejected'?'Rejected':'QR Gen';
return `<tr>
<td>#${d.id}</td><td><strong>${d.name||'-'}</strong></td><td>${d.email||'-'}</td><td>Rs ${d.amount||0}</td><td>${t}</td><td>${new Date(d.created_at).toLocaleDateString()}</td>
<td><span class="status ${sc}">${st}</span></td>
<td class="actions">
<button class="view" onclick="view(${d.id})">View</button>
${d.status==='pending'?`<button class="accept" onclick="updateStatus(${d.id},'verified')">Accept</button><button class="reject" onclick="updateStatus(${d.id},'rejected')">Reject</button>`:''}
<button class="cert" onclick="adminCert(${d.id})">Cert</button>
<button class="rcpt" onclick="adminRcpt(${d.id})">Receipt</button>
<button class="del" onclick="del(${d.id})">Del</button>
</td></tr>`;
}).join('');
}

async function updateStatus(id,status){
if(!confirm(`Mark as ${status}?`))return;
await sb.from('donations').update({status}).eq('id',id);
loadData();
}

async function del(id){
if(!confirm('Delete permanently?'))return;
await sb.from('donations').delete().eq('id',id);
loadData();
}

function view(id){
const d=allData.find(x=>x.id===id);
if(!d)return;
document.getElementById('modalBody').innerHTML=`
${d.screenshot_url?`<img src="${d.screenshot_url}">`:''}
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#f8fafc;padding:16px;border-radius:12px">
<div><div style="font-size:11px;color:#64748b">Name</div><div style="font-weight:600">${d.name}</div></div>
<div><div style="font-size:11px;color:#64748b">Email</div><div style="font-weight:600">${d.email}</div></div>
<div><div style="font-size:11px;color:#64748b">Amount</div><div style="font-weight:600">Rs ${d.amount}</div></div>
<div><div style="font-size:11px;color:#64748b">Status</div><div style="font-weight:600">${d.status}</div></div>
</div>`;
document.getElementById('modal').classList.add('active');
}
function closeModal(){document.getElementById('modal').classList.remove('active')}

function exportCSV(){
let csv='ID,Name,Email,Amount,Trees,Date,Status\n';
filteredData.forEach(d=>csv+=`${d.id},"${d.name}","${d.email}",${d.amount},${Math.max(1,Math.floor(d.amount/10))},${new Date(d.created_at).toLocaleDateString()},${d.status}\n`);
const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURI(csv);a.download='kes_data.csv';a.click();
}

// --- PREMIUM CERTIFICATE GENERATOR ---

const t=Math.max(1,Math.floor((d.amount||0)/10));
const dateStr=new Date(d.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
const certId='KES-CERT-'+d.id.toString().padStart(5,'0');

const h=`<!DOCTYPE html><html><head><title>Certificate - KES Updates</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap');
@page{size:A4 landscape;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#fff;padding:0;display:flex;align-items:center;justify-content:center;height:100vh}
.cert-container{width:100%;height:100%;position:relative;background:#fff;border:20px solid #064e3b;padding:10px}
.cert-inner{width:100%;height:100%;border:4px double #d1fae5;padding:40px 60px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative;background:radial-gradient(circle at center, #f0fdf4 0%, #fff 70%)}
.watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:300px;opacity:0.03;color:#064e3b;pointer-events:none}

.presented{font-size:16px;color:#64748b;margin-bottom:10px;font-style:italic}
.name{font-family:'Playfair Display',serif;font-size:48px;color:#0f172a;margin:10px 0 20px;padding-bottom:10px;border-bottom:2px solid #059669;display:inline-block}
.text{font-size:16px;color:#475569;line-height:1.8;margin-bottom:20px}
.text strong{color:#064e3b}
.badge{display:inline-block;background:#ecfdf5;color:#064e3b;padding:10px 24px;border-radius:50px;font-weight:700;font-size:18px;border:1px solid #a7f3d0;margin-bottom:20px}
.footer{width:100%;display:flex;justify-content:space-between;align-items:flex-end;margin-top:40px;padding-top:20px;border-top:1px solid #e2e8f0}
.footer-item{text-align:center}
.footer-label{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.footer-value{font-size:14px;font-weight:600;color:#0f172a}
.signature{font-family:'Playfair Display',serif;font-size:24px;color:#059669;font-style:italic}
@media print{body{height:100vh}.cert-container{border:20px solid #064e3b}}</style>
</head><body>
<div class="cert-container"><div class="cert-inner">
<div class="watermark">🌳</div>
<div class="header">
<div class="logo">KES Updates</div>
<div class="title">Certificate of Appreciation</div>
<div class="subtitle">Tree Plantation Initiative</div>
</div>
<div class="body">
<div class="presented">This certificate is proudly presented to</div>
<div class="name">${d.name||'Anonymous Donor'}</div>
<div class="text">In recognition of your generous contribution of <strong>Rs ${d.amount||0}</strong> towards our environmental mission. Through your support, we have successfully planted trees to create a sustainable future.</div>
<div class="badge">🌳 ${t} Trees Planted</div>
</div>
<div class="footer">
<div class="footer-item"><div class="footer-label">Date Issued</div><div class="footer-value">${dateStr}</div></div>
<div class="footer-item"><div class="footer-label">Certificate ID</div><div class="footer-value">${certId}</div></div>
<div class="footer-item"><div class="footer-label">Authorized Signature</div><div class="signature">KES Updates Team</div></div>
</div>
</div></div>
<script>window.onload=function(){setTimeout(window.print,500)};<\/script>
</body></html>`;
const w=window.open('','_blank');w.document.write(h);w.document.close();
}

// --- PREMIUM RECEIPT GENERATOR ---
function adminRcpt(id){
const d=allData.find(x=>x.id===id);if(!d)return;
const t=Math.max(1,Math.floor((d.amount||0)/10));
const dateStr=new Date(d.created_at).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const rcptId='KES-RCP-'+d.id.toString().padStart(5,'0');

const h=`<!DOCTYPE html><html><head><title>Receipt - KES Updates</title>

</div>

loadData();
